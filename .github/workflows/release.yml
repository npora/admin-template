name: Release template

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'npora/admin-template'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    defaults:
      run:
        working-directory: admin-template
    steps:
      - uses: actions/checkout@v6
        with:
          path: admin-template
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: npora/create-admin
          ref: main
          path: create-nova-admin
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/release/verify.mjs "$RELEASE_TAG"
      - run: npm ci
      - run: npm run check:all
      - run: npm run build
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo npora/admin-template >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --repo npora/admin-template --verify-tag --generate-notes
