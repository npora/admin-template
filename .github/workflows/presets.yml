name: Template presets

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: presets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  presets:
    # Maintainer integration checks are not application CI.
    if: github.repository == 'npora/admin-template'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: admin-template
    steps:
      - name: Check out this template revision
        uses: actions/checkout@v4
        with:
          path: admin-template
          persist-credentials: false
      - name: Check out the current generator
        uses: actions/checkout@v4
        with:
          repository: ni9542/create-nova-admin
          ref: main
          path: create-nova-admin
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: admin-template/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: admin-template/pnpm-lock.yaml
      - name: Install generator dependencies
        run: npm ci --prefix ../create-nova-admin
      - name: Check generator
        run: npm run check --prefix ../create-nova-admin
      - name: Install template dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate, install and check all three presets
        run: pnpm run check:presets -- ../create-nova-admin --install
